name: Läs recensioner

# Läser kultursektionernas flöden, matchar mot uppsättningarna på sidan och
# sparar de matchade recensionerna i Supabase. Allt körningen såg - matchat och
# omatchat - sparas dessutom som artefakt, eftersom en för snäv regel bara syns
# bland de omatchade.
#
# Uppsättningarna läses från det publika API:et. Jobbet skriver bara till
# reviews-tabellen och kan inte påverka evenemangen.

on:
  schedule:
    # 05:12 UTC, en timme efter skanningen. Uppsättningarna ska vara färska när
    # recensionerna matchas mot dem - en recension av en pjäs som skannern inte
    # hunnit lägga in matchar ingenting.
    - cron: '12 5 * * *'
  workflow_dispatch:

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Läs flödena
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scanner/reviews/run.mjs

      # Artefakt och inte en commit: det här är observationer, inte källkod,
      # och de försvinner av sig själva efter en månad.
      - name: Spara observationerna
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recensioner-${{ github.run_number }}
          path: data/reviews.json
          retention-days: 30
          if-no-files-found: warn
