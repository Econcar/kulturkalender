name: Skanna evenemang

on:
  schedule:
    # 04:12 UTC varje natt, alltså 06:12 svensk sommartid och 05:12 vintertid.
    # Evenemangsprogram ändras i dagsskala, inte i timskala – att skanna oftare
    # belastar scenernas sidor utan att göra listan bättre.
    #
    # Udda minuttal med flit: GitHub kör i UTC, köar allt som står på hel timme,
    # och kan försena schemalagda körningar vid hög last. Raden högst upp på
    # sidan visar när det senast hämtades, så en utebliven körning syns.
    - cron: '12 4 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Kommaseparerade käll-id (tomt = alla aktiva)'
        required: false
        default: ''
      dry_run:
        description: 'Skriv inget till Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Inga beroenden att installera – skannern använder bara Node-inbyggt.
      - name: Kör skannern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_SOURCES: ${{ github.event.inputs.sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scanner/run.mjs
