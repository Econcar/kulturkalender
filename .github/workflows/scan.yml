name: Skanna evenemang

on:
  # Schemat är avstängt tills första adaptern finns. En cron som kör ett tomt
  # källregister varje natt fyller bara scan_runs med rader som inte betyder
  # något. Ta bort kommentaren när scanner/sources/index.mjs har en källa.
  #
  # schedule:
  #   # 04:12 UTC varje natt. Evenemangsprogram ändras i dagsskala, inte i
  #   # timskala – att skanna oftare belastar scenernas sidor utan att göra
  #   # listan bättre. GitHub kör i UTC och kan försena körningar vid hög last.
  #   - cron: '12 4 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Kommaseparerade käll-id (tomt = alla aktiva)'
        required: false
        default: ''
      dry_run:
        description: 'Skriv inget till Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Inga beroenden att installera – skannern använder bara Node-inbyggt.
      - name: Kör skannern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_SOURCES: ${{ github.event.inputs.sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scanner/run.mjs
